<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食卓</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1F2A24">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --card:#FFFFFF; --ink:#1F2A24; --sub:#5E6B63; --line:#D5DCD4;
  --ai:#2F4A7A; --ai-soft:#E3E9F3; --ok:#2E7447; --ok-soft:#E2EFE5; --mid:#A86F0C; --mid-soft:#F6EDD8; --bad:#B2382C; --bad-soft:#F5E1DE;
  --staple:#C9A66B; --main:#B5654F; --side:#5E9A62; --track:#DDE3DB; --zone:#B9DDC3; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A17; --card:#1D2521; --ink:#E6ECE7; --sub:#9AA79F; --line:#2E3A34;
  --ai:#8FAAD8; --ai-soft:#24314A; --ok:#7CC293; --ok-soft:#1F3328; --mid:#E0B45A; --mid-soft:#3A3020; --bad:#E08A7F; --bad-soft:#3E2522;
  --staple:#D8B97F; --main:#D48A73; --side:#86BF8A; --track:#2A3530; --zone:#2E5A3D; color-scheme:dark; } }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:16px;line-height:1.6}
main{max-width:34rem;margin:0 auto;padding:1rem 1rem 6.5rem}
h1{font-size:1.6rem;font-weight:700;letter-spacing:.02em;margin:.2rem 0 .8rem}
h2{font-size:1.05rem;font-weight:700;margin:1.2rem 0 .5rem}
p{margin:.3rem 0}
.note{font-size:.85rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:.5rem 0}
.row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.35rem .85rem;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#101521} }
.btn{border:0;background:var(--ai);color:#fff;border-radius:10px;padding:.55rem 1rem;font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#101521} }
.btn.ghost{background:transparent;color:var(--ai);border:1px solid var(--ai)}
.btn.sm{padding:.35rem .75rem;font-size:.88rem}
.linkx{border:0;background:none;color:var(--sub);text-decoration:underline;padding:.2rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;width:100%}
textarea{min-height:6em}
.tag{font-size:.72rem;padding:.05rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.s{border-color:var(--staple);color:var(--staple)} .tag.m{border-color:var(--main);color:var(--main)} .tag.d{border-color:var(--side);color:var(--side)}
.plan{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem;margin:.45rem 0}
.plan .t{font-weight:700}
.plan.dim{opacity:.55}
.badge{font-size:.72rem;padding:.05rem .5rem;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.badge.why{background:var(--ai-soft);color:var(--ai)}
.badge.miss{background:var(--bad-soft);color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;padding:.7rem 0 .75rem;font-size:.82rem;color:var(--sub)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--ai)}
.nut{padding:.45rem 0;border-bottom:1px solid var(--line)}
.nut:last-child{border-bottom:0}
.nut .top{display:flex;align-items:baseline;gap:.5rem}
.nut .lab{font-weight:700;flex:1}
.nut .val{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.nut .unit{font-size:.78rem;color:var(--sub);margin-left:.1rem}
.pill{font-size:.75rem;font-weight:700;padding:.05rem .55rem;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--mid-soft);color:var(--mid)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--bg);color:var(--sub)}
.nut .bar2{position:relative;height:.8rem;border-radius:999px;background:var(--track);margin:.4rem 0 .25rem;overflow:hidden}
.nut .bar2 .zone{position:absolute;top:0;bottom:0;background:var(--zone);border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.nut .bar2 .zone.open{border-right:0}
.nut .bar2 .zone.from0{border-left:0}
.nut .bar2 .fill{position:absolute;left:0;top:.18rem;bottom:.18rem;border-radius:999px}
.nut .bar2 .fill.over{border-radius:999px 2px 2px 999px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.nut .bar2 .mark{position:absolute;top:0;bottom:0;width:3px;background:var(--ok)}
.nut .rng .over-t{font-weight:700}
.nut .rng{font-size:.78rem;color:var(--sub);font-variant-numeric:tabular-nums}
.ngrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem;margin:.35rem 0 .1rem;text-align:center}
.ngrid div{background:var(--bg);border-radius:8px;padding:.25rem .1rem;font-size:.72rem;color:var(--sub);line-height:1.3}
.ngrid b{display:block;font-size:.88rem;color:var(--ink);font-variant-numeric:tabular-nums}
.sig{display:grid;grid-template-columns:6.2rem 1fr 4.6rem;gap:.5rem;align-items:center;font-size:.9rem;padding:.2rem 0}
.track{position:relative;height:.6rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.track .dot{position:absolute;top:-1px;width:.6rem;height:.6rem;border-radius:50%;transform:translateX(-50%)}
.st{font-size:.8rem;text-align:right;font-weight:700}
.st.ok{color:var(--ok)} .st.mid{color:var(--mid)} .st.bad{color:var(--bad)}
.sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:19}
.item{border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin:.4rem 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:.25rem .55rem;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--ai-soft);color:var(--ai);font-weight:700}
.sat-wrap{position:sticky;bottom:calc(-1.2rem - env(safe-area-inset-bottom,0px));background:var(--card);padding:.6rem 0 .4rem;margin-top:.6rem;border-top:1px solid var(--line)}
.sat{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem}
.sat button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.6rem 0;font-weight:700}
.sat button:first-child{border-color:var(--ok);color:var(--ok)}
.stockgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.stock{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.55rem .7rem;text-align:left;font-size:.92rem}
.lvl{font-size:.75rem;padding:.05rem .5rem;border-radius:999px;font-weight:700;white-space:nowrap;flex:none}
.list-li>span:first-child{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.list-li>.note{font-size:.76rem;text-align:right;max-width:45%}
.lvl.a{background:var(--ok-soft);color:var(--ok)} .lvl.l{background:var(--mid-soft);color:var(--mid)} .lvl.n{background:var(--bad-soft);color:var(--bad)}
.plate-wrap{display:flex;gap:1rem;align-items:center}
.plate-wrap svg{flex:none}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:.5rem 1rem;border-radius:10px;font-size:.9rem;z-index:30}
.list-li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.93rem}
.list-li:last-child{border-bottom:0}
.micro{display:grid;grid-template-columns:7rem 1fr 4.6rem;gap:.5rem;align-items:center;font-size:.88rem;padding:.15rem 0}
.mbar{height:.55rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mbar span{display:block;height:100%}
.cook{position:fixed;inset:0;z-index:25;background:var(--card);padding:calc(1rem + env(safe-area-inset-top,0px)) 1.2rem calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.cook-dots{display:flex;gap:.3rem;margin:.6rem 0 1rem}
.cook-dots i{flex:1;height:.35rem;border-radius:999px;background:var(--track)}
.cook-dots i.done{background:var(--ok)} .cook-dots i.now{background:var(--ai)}
.cook-text{font-size:1.55rem;line-height:1.55;font-weight:700;flex:1;margin:0}
.cook-timer{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:var(--bg);border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem}
#tm-disp{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:.6rem}
.cook-nav .btn{padding:1.1rem 0;font-size:1.15rem}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  if (o.p.dir < 0 && sum("p") >= 20) { sc += 2 * wgt("p"); why.push("たんぱく質が補える"); }
  if (o.fib.dir < 0 && sum("fib") >= 4) { sc += 1 * wgt("fib"); why.push("食物繊維が補える"); }
  if (o.f.dir > 0) { if (sum("f") <= 15) { sc += 2 * wgt("f"); why.push("脂質がひかえめ"); } else if (sum("f") > 25) sc -= 2 * wgt("f"); }
  if (o.salt.dir > 0) { if (sum("salt") <= 2.5) { sc += 1 * wgt("salt"); why.push("塩分がひかえめ"); } else if (sum("salt") > 4) sc -= 1 * wgt("salt"); }
  sig.micro.forEach((m, i) => { if (m.k !== "ok" && foods.some(f => f.micro[i] >= 3)) { sc += (focus === "m" + i ? 2 : 1); if (why.length < 3) why.push(MICRO[i] + "が補える"); } });
  if (pl.items.some(isHit)) { sc += 3; why.unshift("当たり"); }
  const miss = foods.filter(f => f.stock && (D.stock.find(s => s.id === f.stock) || {}).st === 2).map(f => (D.stock.find(s => s.id === f.stock) || {}).name);
  if (pl.scene === "self" && miss.length) sc -= 10;
  return { sc, why: why.slice(0, 3), miss };
}

/* ───────── GitHubに保存する ─────────
   端末に先に保存し、裏で送る。前回そろえたときの中身(base)と比べて、
   こちらで変えた物だけを向こうの最新に当てる(1件ずつ見比べる)ので、2台で記録しても消し合わない */
const CONF_KEY = "shokutaku-conf", BASE_KEY = "shokutaku-base";
let conf = (() => { try { return JSON.parse(localStorage.getItem(CONF_KEY) || "null"); } catch (e) { return null; } })();
let base = (() => { try { return JSON.parse(localStorage.getItem(BASE_KEY) || "null"); } catch (e) { return null; } })();
let sync = { state: conf ? "待機" : "未接続", at: null, err: "" }, syncTimer = null, syncing = false, again = false;

const b64e = str => { const by = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, "")), c => c.charCodeAt(0)));
async function gh(method, body){
  const url = "https://api.github.com/repos/" + conf.repo + "/contents/" + conf.path.split("/").map(encodeURIComponent).join("/") + (method === "GET" ? "?ref=" + encodeURIComponent(conf.branch || "main") + "&t=" + Date.now() : "");
  let r; try { r = await fetch(url, { method, cache: "no-store", headers: { Authorization: "Bearer " + conf.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error("ネットにつながっていない(電波を確かめてください)"); }
  return r;
}
function ghErr(r){
  if (r.status === 401) return "鍵(トークン)が正しくないか、期限が切れている";
  if (r.status === 403) return "鍵に、このリポジトリへの書き込み(Contents: Read and write)が許されていない";
  if (r.status === 404) return "リポジトリかブランチが見つからない、またはこの鍵では見られない";
  if (r.status >= 500) return "GitHubが不調(しばらくしてもう一度)";
  return "GitHubとの通信に失敗した(" + r.status + ")";
}
const KEYS = { ingInfo: x => x.name, logs: x => x.id, memo: x => norm(x.name), stock: x => x.id, foods: x => norm(x.name), cookPlan: x => x.id, shop: x => x.name, plans: x => x.scene + "|" + x.title };
function mergeArr(b, l, r, key){
  const B = new Map((b || []).map(x => [key(x), x])), L = new Map((l || []).map(x => [key(x), x])), out = new Map((r || []).map(x => [key(x), x]));
  B.forEach((v, k) => { if (!L.has(k)) out.delete(k); });
  L.forEach((v, k) => { const bv = B.get(k); if (!bv || JSON.stringify(bv) !== JSON.stringify(v)) out.set(k, v); });
  return [...out.values()];
}
function mergeObj(b, l, r){ b = b || {}; l = l || {}; const out = Object.assign({}, r || {});
  Object.keys(b).forEach(k => { if (!(k in l)) delete out[k]; }); Object.keys(l).forEach(k => { if (JSON.stringify(b[k]) !== JSON.stringify(l[k])) out[k] = l[k]; }); return out; }
function merge3(b, l, r){
  b = b || {}; const out = Object.assign({}, r);
  new Set(Object.keys(l).concat(Object.keys(r))).forEach(k => {
    if (KEYS[k]) out[k] = mergeArr(b[k], l[k], r[k], KEYS[k]);
    else if (k === "weights" || k === "settings") out[k] = mergeObj(b[k], l[k], r[k]);
    else if (JSON.stringify(b[k]) !== JSON.stringify(l[k])) out[k] = l[k];
  });
  return out;
}
function repairRefs(x){   // 2台で同じ料理を入れたとき、記録の指す先を名前でつなぎ直す
  const ids = new Set(x.foods.map(f => f.id));
  x.logs.forEach(l => l.items.forEach(it => { if (it.foodId && !ids.has(it.foodId)) { const k = norm(it.name), f = x.foods.find(g => norm(g.name) === k || (g.alias || []).some(a => norm(a) === k)); it.foodId = f ? f.id : null; } }));
  return x;
}
function setBase(sha, data){ base = { sha, data: clone(data) }; try { localStorage.setItem(BASE_KEY, JSON.stringify(base)); } catch (e) {} }
function scheduleSync(){ if (!conf) return; clearTimeout(syncTimer); syncTimer = setTimeout(runSync, 1200); }
async function runSync(){
  if (!conf) return; if (syncing) { again = true; return; }
  syncing = true; sync.state = "送信中"; sync.err = ""; paintSync();
  try {
    for (let i = 0; i < 4; i++) {
      const r = await gh("GET");
      let remote = null, sha = null;
      if (r.status === 404) { const chk = await fetch("https://api.github.com/repos/" + conf.repo, { headers: { Authorization: "Bearer " + conf.token }, cache: "no-store" }).catch(() => null);
        if (!chk || !chk.ok) throw new Error(chk ? ghErr(chk) : "ネットにつながっていない(電波を確かめてください)"); }
      else if (!r.ok) throw new Error(ghErr(r));
      else { const j = await r.json(); sha = j.sha; remote = JSON.parse(b64d(j.content)); }
      if (remote) {
        if (!base || base.sha !== sha) { const merged = repairRefs(Object.assign(blank(), merge3(base && base.data, D, remote))); D = merged; localStorage.setItem(KEY, JSON.stringify(D)); }
        if (JSON.stringify(D) === JSON.stringify(remote)) { setBase(sha, remote); break; }
      }
      const put = await gh("PUT", { message: "食卓 " + new Date().toLocaleString("ja-JP"), content: b64e(JSON.stringify(D)), branch: conf.branch || "main", ...(sha ? { sha } : {}) });
      if (put.ok) { const j = await put.json(); setBase(j.content.sha, D); break; }
      if (put.status === 409 || put.status === 422) continue;   // その間に別の端末が書いた → 読み直してまとめ直す
      throw new Error(ghErr(put));
    }
    sync.state = "同期済み"; sync.at = Date.now();
  } catch (e) { sync.state = "失敗"; sync.err = e.message; }
  syncing = false; render();
  if (again) { again = false; scheduleSync(); }
}
function paintSync(){ const el = document.getElementById("sync-line"); if (el) el.innerHTML = syncLine(); }
function syncLine(){
  if (!conf) return "";
  const t = sync.at ? new Date(sync.at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "";
  return sync.state === "失敗" ? '<span style="color:var(--bad)">GitHubに送れていません:' + esc(sync.err) + '</span> <button class="linkx" data-sync-now>もう一度</button>'
    : '<span class="note">' + (sync.state === "同期済み" ? "GitHubと同期済み " + t : sync.state === "送信中" ? "GitHubと同期中…" : "GitHubとつながっています") + "</span>";
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(); });
setInterval(() => { if (document.visibilityState === "visible" && conf && !syncing) runSync(); }, 120000);

/* ───────── 作り方・料理モード ───────── */
let recipe = null, wakeLock = null, timer = null;
const hasRecipe = n => { const f = byName(n); return !!(f && f.recipe); };

function recipeView(){

    return '<div class="cook" role="dialog" aria-label="料理モード"><div class="row" style="justify-content:space-between"><span class="note">' + esc(f.name) + " ・ " + (recipe.step + 1) + " / " + r.steps.length + '</span><button class="linkx" data-rstep="-1">一覧に戻る</button></div>' +

      '<p class="cook-text">' + esc(st[0]) + "</p>" +
      (st[1] ? '<div class="cook-timer"><span id="tm-disp">' + (timer && timer.step === recipe.step ? fmtSec(timer.left) : fmtSec(st[1])) + '</span><button class="btn" data-timer="' + st[1] + '">' + (timer && timer.step === recipe.step ? "タイマーを止める" : "タイマー " + fmtSec(st[1])) + "</button></div>" : "") +
      '<div class="cook-nav"><button class="btn ghost" data-rstep="' + (recipe.step - 1) + '"' + (recipe.step === 0 ? " disabled" : "") + '>前へ</button><button class="btn" data-rstep="' + (last ? "done" : recipe.step + 1) + '">' + (last ? "できた" : "次へ") + "</button></div></div>"; }
  return '<div class="sheet-bg" data-close-recipe></div><div class="sheet" role="dialog" aria-label="作り方"><div class="row" style="justify-content:space-between"><b>作り方</b><button class="linkx" data-close-recipe>閉じる</button></div>' + tabsH +

    '<div class="card"><b>手順</b><ol style="margin:.4rem 0 0;padding-left:1.3rem">' + r.steps.map(([t, sec]) => "<li style=\"margin:.3rem 0\">" + esc(t) + (sec ? ' <span class="note">(' + fmtSec(sec) + ")</span>" : "") + "</li>").join("") + "</ol></div>" +
    '<button class="btn" data-rstep="0" style="width:100%;margin-top:.4rem">料理モードで始める</button><p class="note" style="margin-top:.3rem">1手順ずつ大きく出す。料理中は画面が消えない。</p></div>';

const fmtSec = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
async function keepAwake(on){ try { if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {} }

function stopTimer(){ if (timer) { clearInterval(timer.id); timer = null; } }

/* ───────── 描画と操作 ───────── */
function render(){
  const V = { now: nowView, log: logView, stock: stockView, weight: weightView, book: bookView, set: setView };

}
document.addEventListener("click", e => {

  if (d.scene) { scene = d.scene; render(); return; }
  if (d.effort) { effort = d.effort; render(); return; }
  if (d.plan != null && d.plan !== "") { const p = D.plans[+d.plan]; openSheet(p.items, { soup: p.soup }); return; }
  if (b.hasAttribute("data-open-free")) { openSheet([]); setTimeout(() => $("sheet-q") && $("sheet-q").focus(), 30); return; }

  if (d.addNew) { sheet.items.push({ foodId: null, name: sheet.q.trim(), qty: 1, cook: null, soup: null, type: null }); sheet.q = ""; render(); return; }

  if (d.soup) { sheet.items[+d.soup].soup = d.v; render(); return; }
  if (d.itype) { sheet.items[+d.itype].type = d.v; render(); return; }
  if (d.sat) { saveMeal(+d.sat); return; }
  if (d.editLog) { const l = D.logs.find(x => x.id === d.editLog); sheet = { items: l.items.map(it => Object.assign({}, it)), slot: l.slot, q: "", editId: l.id }; render(); return; }

  if (b.hasAttribute("data-nums")) { showNums = !showNums; render(); return; }
  if (d.logsub) { logSub = d.logsub; if (logSub === "day") dayOff = D.logs.some(l => l.day === today()) ? 0 : 1; render(); return; }
  if (d.day) { dayOff = Math.max(0, dayOff + +d.day); render(); return; }
  if (d.goday) { logSub = "day"; dayOff = Math.round((new Date(today()) - new Date(d.goday)) / 864e5); render(); return; }
  if (d.focus != null) { D.focus = d.focus || null; D.lastReview = Date.now(); save(); toast(d.focus ? "今週は「" + focusLabel(d.focus) + "」" : "今週はなし"); render(); return; }
  if (d.st != null && d.st !== "") { const s = D.stock[+d.st]; s.st = (s.st + 1) % 3; save(); render(); return; }
  if (b.hasAttribute("data-copy-shop")) { const t = "買ってきてほしいもの:" + shopList().filter(x => !x.done).map(x => x.name).join("、"); copy(t); return; }
  if (d.buy) { const set = new Set(D.shopDone || []); set.has(d.buy) ? set.delete(d.buy) : set.add(d.buy); D.shopDone = [...set]; save(); render(); return; }
  if (b.hasAttribute("data-shop-finish")) { const done = new Set(D.shopDone || []); if (!done.size) { toast("買った物を押してから終えてください"); return; }
    done.forEach(n => { const st = stockOfIng(n) || D.stock.find(s => s.name === n); if (st) st.st = 0; });
    D.shop = D.shop.filter(x => !done.has(x.name)); D.cookPlan.forEach(cp => cp.bought = (cp.bought || []).concat(cp.ings.filter(n => done.has(n))));
    const n = done.size; D.shopDone = []; save(); toast(n + "個を買いました"); render(); return; }
  if (b.hasAttribute("data-shop-add")) { const n = $("shop-in").value.trim(); if (!n) return; D.shop.push({ name: n, shop: $("shop-at").value }); save(); render(); return; }
  if (d.cpAdd != null && d.cpAdd !== "") { const p = D.plans[+d.cpAdd]; D.cookPlan.push({ id: uid(), title: p.title, items: p.items, ings: planIngs(p), bought: [] }); save(); toast("「" + p.title + "」を作る予定に入れました"); render(); return; }
  if (d.cpDel != null && d.cpDel !== "") { D.cookPlan.splice(+d.cpDel, 1); save(); render(); return; }
  if (b.hasAttribute("data-st-add")) { const n = $("st-name").value.trim(); if (!n) return; D.stock.push({ id: "s" + uid(), name: n, shop: $("st-shop").value, st: 0 }); save(); render(); return; }
  if (d.stDel != null && d.stDel !== "") { D.stock.splice(+d.stDel, 1); save(); render(); return; }
  if (b.hasAttribute("data-w-save")) { const v = parseFloat($("w-in").value); if (!(v > 20 && v < 300)) { toast("kgで入れてください"); return; } D.weights[today()] = r1(v); save(); toast("記録しました"); render(); return; }
  if (d.wDel) { delete D.weights[d.wDel]; save(); render(); return; }
  if (b.hasAttribute("data-memo-add")) { const n = $("memo-in").value.trim(); if (!n) return; if (byName(n)) { toast("「" + byName(n).name + "」はもう図鑑にあります"); return; } D.memo.push({ name: n, note: "", t: Date.now() }); save(); render(); return; }
  if (d.memoDel != null && d.memoDel !== "") { D.memo.splice(+d.memoDel, 1); save(); render(); return; }
  if (b.hasAttribute("data-memo-copy")) { copy(MEMO_PROMPT(D.memo.map(m => m.name + (m.note ? "(" + m.note + ")" : "")))); return; }
  if (b.hasAttribute("data-import-go")) { applyImport(); return; }
  if (b.hasAttribute("data-s-save")) { const s = D.settings; s.sex = $("s-sex").value; s.age = Math.max(10, Math.min(99, +$("s-age").value || 17)); s.act = +$("s-act").value; s.goal = $("s-goal").value; s.weighCond = $("s-wc").value.trim() || s.weighCond; save(); toast("保存しました"); render(); return; }
  if (b.hasAttribute("data-gh-on")) { const repo = $("g-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, ""), token = $("g-token").value.trim();
    if (!/^[^/\s]+\/[^/\s]+$/.test(repo)) { toast("リポジトリは「ユーザー名/リポジトリ名」で入れてください"); return; } if (!token) { toast("鍵(トークン)を入れてください"); return; }
    conf = { repo, branch: $("g-branch").value.trim() || "main", path: $("g-path").value.trim().replace(/^\//, "") || "shokutaku/data.json", token }; localStorage.setItem(CONF_KEY, JSON.stringify(conf)); base = null; localStorage.removeItem(BASE_KEY);
    sync.state = "送信中"; render(); runSync(); return; }
  if (b.hasAttribute("data-gh-off")) { if (!confirm("この端末でGitHubにつなぐのをやめる?(端末のデータとGitHubのデータは、どちらも消えない)")) return; conf = null; base = null; localStorage.removeItem(CONF_KEY); localStorage.removeItem(BASE_KEY); sync = { state: "未接続", at: null, err: "" }; render(); return; }
  if (b.hasAttribute("data-sync-now")) { runSync(); return; }
  if (b.hasAttribute("data-backup")) { const blob = new Blob([JSON.stringify(D, null, 1)], { type: "application/json" }), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "shokutaku-" + today() + ".json"; a.click(); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "sheet-q") { const pos = e.target.selectionStart; sheet.q = e.target.value; render(); const el = $("sheet-q"); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.id === "book-q") { const pos = e.target.selectionStart; bookQ = e.target.value; render(); const el = $("book-q"); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  if (e.target.dataset.cook != null && e.target.dataset.cook !== "") { sheet.items[+e.target.dataset.cook].cook = e.target.value; render(); }
  if (e.target.id === "food-file") { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { importPrev = parseFoodFile(rd.result); render(); }; rd.readAsText(f); }
  if (e.target.id === "restore") { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const x = JSON.parse(rd.result); if (!x.v) throw 0; if (!confirm("今のデータを、このファイルで置き換える?")) return; D = Object.assign(blank(), x); save(); toast("読み込みました"); render(); } catch (err) { toast("読めませんでした"); } }; rd.readAsText(f); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && recipe) { stopTimer(); keepAwake(false); recipe = null; render(); return; } if (e.key === "Escape" && sheet) { sheet = null; render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && recipe && recipe.step >= 0) keepAwake(true); });
function copy(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => { prompt("コピーしてください", t); }); }
render();
if (conf) runSync();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
